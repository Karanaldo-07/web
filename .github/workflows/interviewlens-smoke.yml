# Live smoke coverage includes Gemini adaptive interviewer + GitHub Pages asset checks.
name: InterviewLens Live Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'interviewlens/**'
      - '.github/workflows/interviewlens-smoke.yml'
  workflow_run:
    workflows: ["Deploy InterviewLens"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check live API health
        shell: bash
        run: |
          for i in {1..12}; do
            if curl -fsS https://interviewlens-api.vercel.app/health; then
              echo
              exit 0
            fi
            echo "API not ready yet; retry $i/12"
            sleep 10
          done
          echo "Live API health check failed"
          exit 1

      - name: Check Data Analyst JD targeting
        shell: bash
        run: |
          curl -fsS -X POST https://interviewlens-api.vercel.app/prep \
            -H 'Content-Type: application/json' \
            --data '{"role":"Data Analyst","job_description":"We need a Data Analyst skilled in SQL, Power BI, Excel and Python. Build dashboards, analyze business data and optimize SQL queries."}' > response.json
          python - <<'PY'
          import json
          d=json.load(open('response.json'))
          assert d.get('role_key') == 'data analyst', d
          assert 'sql' in d.get('jd_keywords', []), d
          assert 'power bi' in d.get('jd_keywords', []), d
          assert 'python' in d.get('jd_keywords', []), d
          assert len(d.get('questions', [])) >= 6, d
          print('Data Analyst targeting: PASS')
          print('JD keywords:', d['jd_keywords'])
          PY

      - name: Check Backend JD targeting
        shell: bash
        run: |
          curl -fsS -X POST https://interviewlens-api.vercel.app/prep \
            -H 'Content-Type: application/json' \
            --data '{"role":"Backend Developer","job_description":"Build FastAPI REST APIs with PostgreSQL, authentication, Docker and AWS. Improve reliability and performance."}' > response.json
          python - <<'PY'
          import json
          d=json.load(open('response.json'))
          assert d.get('role_key') == 'backend developer', d
          keys=d.get('jd_keywords', [])
          assert 'fastapi' in keys, d
          assert 'sql' in keys, d
          questions=[x.get('question','').lower() for x in d.get('questions',[])]
          assert any('fastapi' in q for q in questions), d
          assert len(questions) >= 6, d
          print('Backend targeting: PASS')
          print('JD keywords:', keys)
          PY

      - name: Check interview experience endpoint
        shell: bash
        run: |
          curl -fsS 'https://interviewlens-api.vercel.app/experiences/Data%20Analyst' > experiences.json
          python - <<'PY'
          import json
          d=json.load(open('experiences.json'))
          assert d.get('role_key') == 'data analyst', d
          assert isinstance(d.get('items'), list), d
          print('Interview experience endpoint: PASS')
          print('Existing reported questions:', len(d['items']))
          PY

      - name: Check mock AI endpoint and adaptive interviewer
        shell: bash
        run: |
          curl -fsS https://interviewlens-api.vercel.app/mock/health > mock-health.json
          python - <<'PY'
          import json
          d=json.load(open('mock-health.json'))
          assert d.get('status') == 'ok', d
          assert d.get('provider') == 'gemini', d
          assert d.get('configured') is True, d
          print('Mock AI endpoint: PASS')
          print('Gemini configured:', d.get('configured'))
          PY
          curl -fsS -X POST https://interviewlens-api.vercel.app/mock/next \
            -H 'Content-Type: application/json' \
            --data '{"role":"Data Analyst","job_description":"Analyze business data using SQL and Power BI.","current_question":"How do you optimize a slow SQL query?","candidate_answer":"I inspect the execution plan, add appropriate indexes, reduce unnecessary rows and retest.","evaluation":{"total":82,"relevance":26,"completeness":25,"structure":17,"specificity":14},"asked_questions":["How do you optimize a slow SQL query?"],"question_number":1,"total_questions":5}' > next.json
          python - <<'PY'
          import json
          d=json.load(open('next.json'))
          assert isinstance(d.get('next_question'), str) and len(d['next_question']) >= 5, d
          assert d.get('category'), d
          assert d.get('difficulty'), d
          print('Adaptive interviewer: PASS')
          print('Next category:', d['category'], '| difficulty:', d['difficulty'])
          PY
          curl -fsS https://karanaldo-07.github.io/web/interviewlens/mock.js > mock.js
          grep -q 'AI Mock Interview' mock.js
          grep -q '/mock/evaluate' mock.js
          grep -q '/mock/next' mock.js
          echo 'Mock interview asset: PASS'

      - name: Check live GitHub Pages site
        shell: bash
        run: |
          curl -fsS https://karanaldo-07.github.io/web/interviewlens/ > site.html
          grep -q 'InterviewLens' site.html
          grep -q 'app.js' site.html
          grep -q 'mock.js' site.html
          grep -q 'Candidate interview experiences' site.html
          echo 'GitHub Pages: PASS'
